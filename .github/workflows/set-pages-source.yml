name: Set Pages source to gh-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/set-pages-source.yml"

permissions:
  pages: write
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Point Pages at gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -f build_type='legacy' \
            -F source[branch]='gh-pages' \
            -F source[path]='/'
          echo "Pages source after update:"
          gh api "repos/${GITHUB_REPOSITORY}/pages"
